name: commerce-qa

# Blocks merges if any <Price>, <BookingLink>, or <VenueDetails> slug
# in source no longer resolves to an active commerce_* row, or if any
# active venue is missing its public page / booking link / price.

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/commerce-slug-lint.ts"
      - "scripts/venue-page-coverage.ts"
      - ".github/workflows/commerce-qa.yml"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  commerce-slugs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Commerce slug existence lint
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: bun scripts/commerce-slug-lint.ts
      - name: Venue page coverage
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: bun scripts/venue-page-coverage.ts
      - name: Frontend tests (venue render)
        run: bun run test
